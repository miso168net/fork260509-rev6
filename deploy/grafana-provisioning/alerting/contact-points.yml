# rev4:016-observability rev4:T012：webhook 接觸點 provisioning（契約＝contracts/alerting-delivery.md；rev4:FR-011）。
# ★secret 注入＝$__file provider 直讀 /run/secrets/alert_webhook_url（rev4:research R4 主案、源碼三段
#   閉合實證；歷史 issue 56437 已判定已修——rev4:T013 冒煙驗 contact point 實值非字面 $__file、
#   失敗才切 env-wrapper 備案）。
# ★寫法坑（R4）：本 yaml 經 volume 掛載進容器、不經 compose 插值——單 $ 即可；
#   只有 compose environment 值才需 $$ 雙寫（docker-compose.yml grafana 段 GF_SECURITY_ADMIN_PASSWORD 即彼形）。
# URL 不以完整字面進版本庫：真值住 $SECRETS_DIR/alert_webhook_url.txt（★rev4:019 rev4:US3 起落點由 repo 根
#   .env 的 SECRETS_DIR 決定、未設才回退 repo 內 deploy/secrets；generate-secrets placeholder 形
#   ＋preflight REQUIRED；rev4:T002 as-built）。密文權威來源＝deploy/secrets.dev.enc.yaml 之
#   alert_webhook_url key（rev4:019）。
# ★誠實登記（rev4:019 U6）：現值＝不可達佔位（.invalid 保留域）；真值收件端待 NOTES 未決拍板、
#   換值走 RUNBOOK §15.4。
apiVersion: 1

contactPoints:
  - orgId: 1
    name: rev6-webhook
    receivers:
      - uid: rev6-webhook
        type: webhook
        settings:
          url: $__file{/run/secrets/alert_webhook_url}
          httpMethod: POST
